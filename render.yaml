# Render Blueprint: creates the API and its Postgres database.
# Render dashboard → New → Blueprint → pick this repository.
# After the first deploy, fill in the variables marked `sync: false`.
databases:
  - name: kachipapa-db
    plan: free            # upgrade to a paid plan before going live (free DBs expire)
    databaseName: kachipapa
    user: kachipapa

services:
  - type: web
    name: kachipapa-api
    runtime: docker
    rootDir: backend
    plan: free            # free instances sleep when idle; use "starter" for production
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kachipapa-db
          property: connectionString
      - key: DB_SSL
        value: "false"    # internal Render connection
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SETUP_KEY
        generateValue: true   # copy it from the dashboard to create the first admin
      - key: CORS_ORIGINS
        sync: false           # e.g. https://kachipapa-store.netlify.app
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL the web build talks to, e.g. https://kachipapa-api.onrender.com/api"
        required: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kachipapa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kachipapa_test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build web
        run: flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL"
        env:
          API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || 'http://localhost:3000/api' }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/build/web

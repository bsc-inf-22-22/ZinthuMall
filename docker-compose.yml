# Local development: Postgres + API.
#   docker compose up --build
# API: http://localhost:3000/api   (health check: /api/health)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kachipapa
      POSTGRES_PASSWORD: kachipapa-dev   # local only
      POSTGRES_DB: kachipapa
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kachipapa"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://kachipapa:kachipapa-dev@db:5432/kachipapa
      JWT_SECRET: local-development-secret-change-me
      ADMIN_SETUP_KEY: local-setup-key
    env_file:
      - path: ./backend/.env   # optional: Cloudinary keys etc.
        required: false
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
